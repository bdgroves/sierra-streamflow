name: Fetch Sierra Streamflow Data

on:
  schedule:
    - cron: '0 * * * *'   # every hour on the hour
  workflow_dispatch:        # manual trigger

permissions:
  contents: write
  issues: write

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch USGS data
        env:
          USGS_API_KEY: ${{ secrets.USGS_API_KEY }}   # optional; leave unset to use the anonymous limit
        run: python scripts/fetch.py

      - name: Check for data changes
        id: diff
        run: |
          git add -N data/processed data/history
          git diff --quiet data/processed data/history \
            && echo "changed=false" >> $GITHUB_OUTPUT \
            || echo "changed=true"  >> $GITHUB_OUTPUT

      - name: Commit and push (only if data changed)
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed data/history
          git commit -m "data: update streamflow $(date -u '+%Y-%m-%dT%H:%MZ')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      - name: Open a storm-watch issue (first storm of the water year)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' > storm.txt
          import json
          d = json.load(open("data/processed/streamflow.json"))
          for s in d.get("storm", []):
              print(f"- **{s['short']}** ({s['id']}): {s['flow']} cfs, {s['d24h']:+} in 24 h, status {s['status']}")
          print(f"WY={d['water_year']}")
          PY
          wy=$(grep '^WY=' storm.txt | cut -d= -f2)
          if ! grep -q '^- ' storm.txt; then echo "No storm flagged"; exit 0; fi
          title="Storm watch WY${wy}: first storm on the undammed gages"
          if gh issue list --state all --search "in:title \"Storm watch WY${wy}\"" --json number --jq 'length' | grep -qv '^0$'; then
            echo "Storm-watch issue for WY${wy} already exists"; exit 0
          fi
          {
            echo "The hourly job flagged the first storm of water year ${wy} on gages with no dams above them:"
            echo
            grep '^- ' storm.txt
            echo
            echo "Worth a look at https://brooksgroves.com/sierra-streamflow/ while it's happening:"
            echo "- Do Happy Isles and Big Creek get a sensible percentile label (above / much above normal)?"
            echo "- Does the 7-day chart show the rise cleanly, and does the red water-year line climb out of the bands?"
            echo "- Does the page still say \"quiet hour\" anywhere it shouldn't? (The job should be committing every hour during a storm.)"
            echo
            echo "_Opened automatically by the fetch workflow; it opens one of these per water year._"
          } > body.md
          gh issue create --title "$title" --body-file body.md
